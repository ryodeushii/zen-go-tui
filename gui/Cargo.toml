[package]
name = "zen-go-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zen-go-gui"
path = "src/main.rs"

[dependencies]
zen-go-tui = { path = ".." }
antelope-protocol = { path = "../antelope-protocol" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
iced = { version = "0.13", features = ["tokio", "advanced", "image"] }
iced_runtime = "0.13"
tokio = { version = "1", features = ["sync", "time"] }
tray-icon = "0.19"
muda = "0.15"
gtk = "0.18"
crossbeam-channel = "0.5"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
