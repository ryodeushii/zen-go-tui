[package]
name = "zen-go-tui"
version = "0.1.0"
edition = "2021"

[lib]
name = "zen_go_tui"
path = "src/lib.rs"

[[bin]]
name = "zen-go-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
ratatui = "0.29"
thiserror = "2.0"
